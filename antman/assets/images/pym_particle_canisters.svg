<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 120" width="260" height="120" aria-label="Pym Particle Canisters">
  <defs>
    <filter id="fluid-glow-red" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="fluid-glow-blue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="canister-housing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="red-fluid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff1744" />
      <stop offset="40%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="blue-fluid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="glass-glare" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Canister 1: RED SHRINKING PYM PARTICLES -->
  <g transform="translate(15, 10)">
    <!-- Titanium Top Cap -->
    <rect x="20" y="4" width="40" height="10" rx="3" fill="url(#canister-housing)" stroke="#64748b" stroke-width="1.5" />
    <circle cx="40" cy="9" r="2.5" fill="#ff1744" />
    <!-- Glass Tube Chamber -->
    <rect x="24" y="14" width="32" height="72" rx="6" fill="#090e17" stroke="#475569" stroke-width="2" />
    <!-- Glowing Red Particle Fluid -->
    <rect x="27" y="24" width="26" height="58" rx="4" fill="url(#red-fluid)" filter="url(#fluid-glow-red)" />
    <!-- Subatomic Particle Bubbles -->
    <circle cx="34" cy="40" r="2" fill="#ffffff" opacity="0.8" />
    <circle cx="44" cy="55" r="1.5" fill="#ffffff" opacity="0.9" />
    <circle cx="37" cy="70" r="2.5" fill="#ffffff" opacity="0.7" />
    <!-- Glass Glare Highlight -->
    <rect x="26" y="16" width="6" height="68" rx="2" fill="url(#glass-glare)" />
    <!-- Titanium Bottom Base -->
    <rect x="18" y="86" width="44" height="12" rx="3" fill="url(#canister-housing)" stroke="#64748b" stroke-width="1.5" />
    <!-- Label -->
    <text x="40" y="110" font-family="'Courier New', monospace" font-size="9" font-weight="700" fill="#ff5252" text-anchor="middle" letter-spacing="1">
      PYM-RED // COMPRESS
    </text>
  </g>

  <!-- Canister 2: BLUE GROWTH PYM PARTICLES -->
  <g transform="translate(145, 10)">
    <!-- Titanium Top Cap -->
    <rect x="20" y="4" width="40" height="10" rx="3" fill="url(#canister-housing)" stroke="#64748b" stroke-width="1.5" />
    <circle cx="40" cy="9" r="2.5" fill="#38bdf8" />
    <!-- Glass Tube Chamber -->
    <rect x="24" y="14" width="32" height="72" rx="6" fill="#090e17" stroke="#475569" stroke-width="2" />
    <!-- Glowing Blue Particle Fluid -->
    <rect x="27" y="24" width="26" height="58" rx="4" fill="url(#blue-fluid)" filter="url(#fluid-glow-blue)" />
    <!-- Subatomic Particle Bubbles -->
    <circle cx="45" cy="35" r="2" fill="#ffffff" opacity="0.8" />
    <circle cx="35" cy="50" r="1.5" fill="#ffffff" opacity="0.9" />
    <circle cx="43" cy="68" r="2.5" fill="#ffffff" opacity="0.7" />
    <!-- Glass Glare Highlight -->
    <rect x="26" y="16" width="6" height="68" rx="2" fill="url(#glass-glare)" />
    <!-- Titanium Bottom Base -->
    <rect x="18" y="86" width="44" height="12" rx="3" fill="url(#canister-housing)" stroke="#64748b" stroke-width="1.5" />
    <!-- Label -->
    <text x="40" y="110" font-family="'Courier New', monospace" font-size="9" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">
      PYM-BLUE // EXPAND
    </text>
  </g>
</svg>

