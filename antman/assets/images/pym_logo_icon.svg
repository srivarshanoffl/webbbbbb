<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90" width="90" height="90" aria-label="Pym Technologies Emblem">
  <defs>
    <filter id="pym-emblem-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="emblem-red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff334b" />
      <stop offset="60%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="emblem-silver-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <g transform="translate(0, 10)">
    <!-- Connecting Bonds -->
    <line x1="25" y1="45" x2="45" y2="22" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" opacity="0.9" />
    <line x1="45" y1="22" x2="65" y2="55" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" opacity="0.9" />
    <line x1="25" y1="45" x2="65" y2="55" stroke="#ff334b" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />
    
    <!-- Outer Orbit Ring -->
    <ellipse cx="45" cy="42" rx="40" ry="20" fill="none" stroke="#00e5ff" stroke-width="2" stroke-dasharray="6 3" transform="rotate(-20 45 42)" opacity="0.75" />

    <!-- Atoms -->
    <!-- Atom 1: Top (Blue Pym Growth Particle) -->
    <circle cx="45" cy="22" r="10" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5" filter="url(#pym-emblem-glow)" />
    <circle cx="42" cy="19" r="3.5" fill="#ffffff" opacity="0.9" />
    
    <!-- Atom 2: Bottom Left (Red Pym Shrink Particle) -->
    <circle cx="25" cy="45" r="12" fill="url(#emblem-red-grad)" stroke="#ff8090" stroke-width="2.5" filter="url(#pym-emblem-glow)" />
    <circle cx="21" cy="41" r="4" fill="#ffffff" opacity="0.95" />

    <!-- Atom 3: Bottom Right (Silver Regulator Hub) -->
    <circle cx="65" cy="55" r="9" fill="url(#emblem-silver-grad)" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="62" cy="52" r="3" fill="#ffffff" />
  </g>
</svg>

