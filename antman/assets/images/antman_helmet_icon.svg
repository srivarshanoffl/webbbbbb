<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" aria-label="Ant-Man Helmet Icon">
  <defs>
    <filter id="icon-visor-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="helm-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="helm-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff334b" />
      <stop offset="60%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
  </defs>

  <!-- Antennae Spikes -->
  <line x1="36" y1="28" x2="24" y2="6" stroke="url(#helm-silver)" stroke-width="3" stroke-linecap="round" />
  <circle cx="24" cy="6" r="2.5" fill="#ff1744" />
  <line x1="64" y1="28" x2="76" y2="6" stroke="url(#helm-silver)" stroke-width="3" stroke-linecap="round" />
  <circle cx="76" cy="6" r="2.5" fill="#ff1744" />

  <!-- Helmet Outer Silhouette -->
  <path d="M 28 36 C 28 16, 72 16, 72 36 C 76 46, 74 64, 68 72 C 62 80, 38 80, 32 72 C 26 64, 24 46, 28 36 Z" fill="url(#helm-silver)" stroke="#334155" stroke-width="2" />

  <!-- Center Forehead Crest (Red) -->
  <path d="M 44 20 L 56 20 L 54 34 L 46 34 Z" fill="url(#helm-red)" />
  
  <!-- Temporal Insets (Dark Charcoal) -->
  <path d="M 32 38 L 40 38 L 38 48 L 30 48 Z" fill="#0f172a" />
  <path d="M 68 38 L 60 38 L 62 48 L 70 48 Z" fill="#0f172a" />

  <!-- Iconic Angled Crimson Glowing Visors -->
  <g filter="url(#icon-visor-glow)">
    <!-- Left Eye -->
    <polygon points="34,44 47,44 45,53 35,51" fill="#ff1744" stroke="#ffffff" stroke-width="0.8" />
    <!-- Right Eye -->
    <polygon points="66,44 53,44 55,53 65,51" fill="#ff1744" stroke="#ffffff" stroke-width="0.8" />
  </g>

  <!-- Mouth Respirator Unit -->
  <circle cx="50" cy="68" r="8" fill="#1e293b" stroke="url(#helm-silver)" stroke-width="2" />
  <circle cx="50" cy="68" r="4" fill="#0f172a" />
  <line x1="50" y1="64" x2="50" y2="72" stroke="#64748b" stroke-width="1.5" />
  
  <!-- Dual Chin Audio Filters -->
  <circle cx="36" cy="70" r="3" fill="url(#helm-silver)" />
  <circle cx="64" cy="70" r="3" fill="url(#helm-silver)" />
</svg>

