<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" aria-label="Quantum Core Regulator">
  <defs>
    <filter id="core-surge-filter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="plasma-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#34d399" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </radialGradient>
    <linearGradient id="ring-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Outer Structural Chassis (Octagonal) -->
  <polygon points="46,10 114,10 150,46 150,114 114,150 46,150 10,114 10,46" fill="#09121f" stroke="#1e3a5f" stroke-width="3" />
  
  <!-- Corner Bolt Fasteners -->
  <circle cx="20" cy="50" r="3" fill="#64748b" />
  <circle cx="50" cy="20" r="3" fill="#64748b" />
  <circle cx="110" cy="20" r="3" fill="#64748b" />
  <circle cx="140" cy="50" r="3" fill="#64748b" />
  <circle cx="140" cy="110" r="3" fill="#64748b" />
  <circle cx="110" cy="140" r="3" fill="#64748b" />
  <circle cx="50" cy="140" r="3" fill="#64748b" />
  <circle cx="20" cy="110" r="3" fill="#64748b" />

  <!-- Outer Gimbal Ring (Cyan Magnetic Coil) -->
  <circle cx="80" cy="80" r="58" fill="none" stroke="#0284c7" stroke-width="4" stroke-dasharray="14 6" opacity="0.8" />
  
  <!-- Middle Rotating Armature Ring -->
  <circle cx="80" cy="80" r="46" fill="url(#ring-metal)" stroke="#38bdf8" stroke-width="2" />
  <line x1="80" y1="34" x2="80" y2="44" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line x1="80" y1="116" x2="80" y2="126" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line x1="34" y1="80" x2="44" y2="80" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line x1="116" y1="80" x2="126" y2="80" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

  <!-- Inner High-Energy Plasma Conduit Ring -->
  <circle cx="80" cy="80" r="34" fill="#042f2e" stroke="#10b981" stroke-width="2.5" />
  
  <!-- Central Plasma Fusion Sphere -->
  <circle cx="80" cy="80" r="22" fill="url(#plasma-center)" filter="url(#core-surge-filter)" />
  
  <!-- Inner White Energy Spark -->
  <circle cx="77" cy="76" r="6" fill="#ffffff" opacity="0.9" />
  <circle cx="85" cy="84" r="3" fill="#ffffff" opacity="0.7" />
  
  <!-- Regulator Status Crosshairs -->
  <path d="M 68 80 L 92 80 M 80 68 L 80 92" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.75" />
</svg>

