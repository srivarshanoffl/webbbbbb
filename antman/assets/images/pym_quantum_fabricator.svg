<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" aria-label="Pym Technologies Nano-Fabricator 4000 Quantum Compression Chamber">
  <defs>
    <!-- Glow Filters -->
    <filter id="qfab-core-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="qfab-arc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Metallic & Tech Gradients -->
    <linearGradient id="qfab-chassis-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="30%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="qfab-bezel-silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="75%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="qfab-copper-coil" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <linearGradient id="qfab-titanium-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="40%" stop-color="#475569" />
      <stop offset="60%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <radialGradient id="qfab-plasma-vortex" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#ff334b" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="80%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#050508" />
    </radialGradient>

    <linearGradient id="qfab-conduit-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff1744" />
      <stop offset="50%" stop-color="#ff5252" />
      <stop offset="100%" stop-color="#b71c1c" />
    </linearGradient>

    <linearGradient id="qfab-conduit-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Heavy Outer Chassis Frame -->
  <rect x="15" y="15" width="370" height="470" rx="16" fill="url(#qfab-chassis-metal)" stroke="#475569" stroke-width="3" />
  
  <!-- Outer Bolt Fasteners -->
  <circle cx="30" cy="30" r="5" fill="#64748b" stroke="#1e293b" stroke-width="2" />
  <circle cx="370" cy="30" r="5" fill="#64748b" stroke="#1e293b" stroke-width="2" />
  <circle cx="30" cy="470" r="5" fill="#64748b" stroke="#1e293b" stroke-width="2" />
  <circle cx="370" cy="470" r="5" fill="#64748b" stroke="#1e293b" stroke-width="2" />
  <circle cx="30" cy="250" r="5" fill="#64748b" stroke="#1e293b" stroke-width="2" />
  <circle cx="370" cy="250" r="5" fill="#64748b" stroke="#1e293b" stroke-width="2" />

  <!-- Side Carbon Fiber Armor Ribs -->
  <g opacity="0.7">
    <rect x="25" y="80" width="12" height="18" rx="2" fill="#334155" />
    <rect x="25" y="110" width="12" height="18" rx="2" fill="#334155" />
    <rect x="25" y="140" width="12" height="18" rx="2" fill="#334155" />
    <rect x="25" y="320" width="12" height="18" rx="2" fill="#334155" />
    <rect x="25" y="350" width="12" height="18" rx="2" fill="#334155" />
    <rect x="25" y="380" width="12" height="18" rx="2" fill="#334155" />

    <rect x="363" y="80" width="12" height="18" rx="2" fill="#334155" />
    <rect x="363" y="110" width="12" height="18" rx="2" fill="#334155" />
    <rect x="363" y="140" width="12" height="18" rx="2" fill="#334155" />
    <rect x="363" y="320" width="12" height="18" rx="2" fill="#334155" />
    <rect x="363" y="350" width="12" height="18" rx="2" fill="#334155" />
    <rect x="363" y="380" width="12" height="18" rx="2" fill="#334155" />
  </g>

  <!-- Pym Particle Supply Lines (Left: Red Shrink, Right: Blue Expand) -->
  <!-- Left Red Conduit -->
  <path d="M 46 90 L 46 390 Q 46 410 70 410 L 110 410" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round" />
  <path d="M 46 90 L 46 390 Q 46 410 70 410 L 110 410" fill="none" stroke="url(#qfab-conduit-red)" stroke-width="5" stroke-linecap="round" filter="url(#qfab-arc-glow)" opacity="0.9" />
  <rect x="40" y="210" width="12" height="30" rx="3" fill="#64748b" stroke="#334155" stroke-width="1.5" />

  <!-- Right Blue Conduit -->
  <path d="M 354 90 L 354 390 Q 354 410 330 410 L 290 410" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round" />
  <path d="M 354 90 L 354 390 Q 354 410 330 410 L 290 410" fill="none" stroke="url(#qfab-conduit-blue)" stroke-width="5" stroke-linecap="round" filter="url(#qfab-arc-glow)" opacity="0.9" />
  <rect x="348" y="210" width="12" height="30" rx="3" fill="#64748b" stroke="#334155" stroke-width="1.5" />

  <!-- Header Bezel (Machine Name & Warning Indicators) -->
  <rect x="40" y="35" width="320" height="42" rx="6" fill="#090d16" stroke="url(#qfab-bezel-silver)" stroke-width="2" />
  <!-- Hazard Diagonal Stripes Accent -->
  <g opacity="0.25">
    <path d="M 45 72 L 55 37 M 60 72 L 70 37 M 75 72 L 85 37 M 315 72 L 325 37 M 330 72 L 340 37 M 345 72 L 355 37" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
  </g>
  <!-- Technical Stencil Text -->
  <text x="200" y="58" font-family="'Courier New', monospace, sans-serif" font-size="12" font-weight="900" fill="#f8fafc" letter-spacing="2.5" text-anchor="middle">
    PYM NANO-FABRICATOR 4000
  </text>
  <text x="200" y="70" font-family="'Courier New', monospace, sans-serif" font-size="7" font-weight="700" fill="#00e5ff" letter-spacing="2" text-anchor="middle">
    QUANTUM TUNNEL COMPRESSION ARRAY
  </text>

  <!-- Central Quantum Tunnel Aperture Assembly -->
  <!-- Outer Copper Induction Toroid -->
  <circle cx="200" cy="240" r="142" fill="none" stroke="url(#qfab-copper-coil)" stroke-width="10" stroke-dasharray="14 4" opacity="0.85" />
  <circle cx="200" cy="240" r="136" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Outer Stator Bezel with Directional Nodes -->
  <circle cx="200" cy="240" r="126" fill="url(#qfab-titanium-ring)" stroke="#64748b" stroke-width="3" />
  
  <!-- Stator Caliper Plates -->
  <g fill="#1e293b" stroke="#475569" stroke-width="1.5">
    <!-- North Caliper -->
    <path d="M 185 114 L 215 114 L 210 135 L 190 135 Z" />
    <circle cx="200" cy="125" r="3" fill="#ff334b" />
    <!-- South Caliper -->
    <path d="M 185 366 L 215 366 L 210 345 L 190 345 Z" />
    <circle cx="200" cy="355" r="3" fill="#ff334b" />
    <!-- West Caliper -->
    <path d="M 74 225 L 74 255 L 95 250 L 95 230 Z" />
    <circle cx="85" cy="240" r="3" fill="#00e5ff" />
    <!-- East Caliper -->
    <path d="M 326 225 L 326 255 L 305 250 L 305 230 Z" />
    <circle cx="315" cy="240" r="3" fill="#00e5ff" />
  </g>

  <!-- Middle Rotating Gimbal Ring with Radial Tics -->
  <circle cx="200" cy="240" r="98" fill="#0b121e" stroke="#38bdf8" stroke-width="2" stroke-dasharray="18 6" opacity="0.9" />
  
  <!-- Hydraulic Iris Compression Blades (4 Curved Titanium Blades) -->
  <g fill="#131d2e" stroke="#334866" stroke-width="2" opacity="0.95">
    <path d="M 200 148 C 240 148, 280 185, 280 225 L 240 220 C 235 190, 215 175, 190 170 Z" />
    <path d="M 292 240 C 292 280, 255 320, 215 320 L 220 280 C 250 275, 265 255, 270 230 Z" />
    <path d="M 200 332 C 160 332, 120 295, 120 255 L 160 260 C 165 290, 185 305, 210 310 Z" />
    <path d="M 108 240 C 108 200, 145 160, 185 160 L 180 200 C 150 205, 135 225, 130 250 Z" />
  </g>

  <!-- Deep Aperture Intake Singularity Core -->
  <circle cx="200" cy="240" r="62" fill="url(#qfab-plasma-vortex)" filter="url(#qfab-core-glow)" />

  <!-- Quantum Energy Plasma Shockwaves & Swirl -->
  <g filter="url(#qfab-arc-glow)" opacity="0.95">
    <!-- Inner Swirling Arcs -->
    <path d="M 180 225 Q 200 200 225 215 Q 240 235 220 255 Q 195 265 175 245 Z" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.85" />
    <circle cx="200" cy="240" r="16" fill="#ffffff" filter="url(#qfab-core-glow)" />
    <!-- Orbiting Quantum Sparks -->
    <circle cx="178" cy="228" r="2.5" fill="#ffffff" />
    <circle cx="224" cy="232" r="3" fill="#ff8090" />
    <circle cx="194" cy="260" r="2" fill="#80d8ff" />
    <circle cx="212" cy="254" r="2.5" fill="#ffffff" />
  </g>

  <!-- Lower Exhaust Vent & Plasma Radiator -->
  <rect x="70" y="425" width="260" height="38" rx="6" fill="#090f1a" stroke="#334155" stroke-width="2" />
  <g stroke="#1e293b" stroke-width="3">
    <line x1="85" y1="428" x2="85" y2="460" />
    <line x1="105" y1="428" x2="105" y2="460" />
    <line x1="125" y1="428" x2="125" y2="460" />
    <line x1="145" y1="428" x2="145" y2="460" />
    <line x1="165" y1="428" x2="165" y2="460" />
    <line x1="185" y1="428" x2="185" y2="460" />
    <line x1="205" y1="428" x2="205" y2="460" />
    <line x1="225" y1="428" x2="225" y2="460" />
    <line x1="245" y1="428" x2="245" y2="460" />
    <line x1="265" y1="428" x2="265" y2="460" />
    <line x1="285" y1="428" x2="285" y2="460" />
    <line x1="305" y1="428" x2="305" y2="460" />
  </g>
  <line x1="80" y1="444" x2="320" y2="444" stroke="#ff1744" stroke-width="1.5" opacity="0.6" stroke-dasharray="8 6" filter="url(#qfab-arc-glow)" />

  <!-- Lower Serial Stencil -->
  <text x="200" y="480" font-family="'Courier New', monospace, sans-serif" font-size="8" font-weight="700" fill="#64748b" letter-spacing="1.5" text-anchor="middle">
    DR. H. PYM LABS // SUBATOMIC SERIAL #004-998-QX
  </text>
</svg>

